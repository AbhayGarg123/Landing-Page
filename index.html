<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Landing Page</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FCF9F6] font-sans antialiased text-gray-900 min-h-screen">

    <nav class="w-full bg-[#ffffff] px-12 py-5 flex items-center justify-between position-sticky top-0 z-50">
        <div class="flex items-center gap-1.5">
            <span class="text-base font-bold text-gray-900 flex items-center gap-1">
                <span class="text-lg">✦</span> Project
            </span>
        </div>
        
        <div class="flex items-center gap-8 text-[13px] font-medium text-gray-600">
            <a href="#" class="hover:text-black transition">Product</a>
            <a href="#" class="hover:text-black transition">Solutions</a>
            <a href="#" class="hover:text-black transition">Resources</a>
            <a href="#" class="hover:text-black transition">Pricing</a>
            <a href="#" class="hover:text-black transition text-gray-900 font-semibold">Log in</a>
            <a href="#" class="bg-[#0F172A] text-white px-4 py-2 rounded text-[13px] font-medium hover:bg-gray-800 transition">
                Get AI free
            </a>
        </div>
    </nav>

    <section class="pt-12 pb-24 px-6 text-center">
        
        <h1 class="text-4xl md:text-[52px] font-extrabold tracking-tight text-gray-900 leading-[1.15] mb-4">
            Write, plan, share.<br>With AI at your side.
        </h1>
        
        <p class="text-gray-500 text-sm md:text-base max-w-2xl mx-auto mb-8 font-medium">
            It is the connected workspace where better, faster work happens. Now with AI.
        </p>

        <div class="flex items-center justify-center mb-16">
            <button class="bg-[#0F172A] text-white px-5 py-2.5 rounded-l text-[13px] font-semibold tracking-wide hover:bg-gray-800 transition">
                Get AI free &rarr;
            </button>
            <button class="bg-[#2563EB] text-white px-5 py-2.5 rounded-r text-[13px] font-semibold tracking-wide hover:bg-blue-700 transition">
                Request a demo
            </button>
        </div>

        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-12 px-4 relative">
            
            <div class="w-full md:w-1/4 flex justify-center md:justify-start">
                <div class="bg-white px-4 py-3 rounded-lg shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-gray-100/80 text-left min-w-[180px]">
                    <div class="flex items-center gap-2 mb-1.5">
                        <span class="p-1 bg-purple-50 text-purple-500 rounded text-xs">📝</span>
                        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Tasks</span>
                    </div>
                    <p class="text-[11px] font-medium text-gray-400">12 tasks completed today</p>
                </div>
            </div>

            <div class="w-full md:w-2/4 max-w-md mx-auto">
                <div class="rounded-lg bg-white p-1.5 shadow-[0_10px_30px_rgba(0,0,0,0.06)] border border-gray-200/60">
                    <img src="./report.png" 
                         alt="Main Whiteboard Preview" 
                         class="w-full h-auto rounded object-cover">
                </div>
            </div>

            <div class="w-full md:w-1/4 flex flex-col gap-10 items-center md:items-end">
                
                <div class="bg-white px-4 py-3 rounded-lg shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-gray-100/80 text-left min-w-[180px]">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs">✅</span>
                        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Project Status</span>
                    </div>
                    <p class="text-[12px] font-bold text-emerald-600">On Track</p>
                </div>
                <div class="bg-white px-4 py-3 rounded-lg shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-gray-100/80 text-left min-w-[180px]">
                    <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-2">Team Activity</span>
                    <div class="flex items-center gap-3">
                        <div class="flex -space-x-1.5">
                            <div class="w-5 h-5 rounded-full bg-red-400 border border-white"> <img src="girl1.png" class="h-full w-full object-cover"></div>
                            <div class="w-5 h-5 rounded-full bg-blue-400 border border-white"><img src="user2.png" alt="User 2" class="h-full w-full object-cover"></div>
                            <div class="w-5 h-5 rounded-full bg-green-400 border border-white"><img src="user3.png" alt="User 3" class="h-full w-full object-cover"></div>
                        </div>
                        <span class="text-[11px] font-semibold text-gray-500">3 online</span>
                    </div>
                </div>

            </div>

        </div>
    </section>
    <div class="fixed bottom-6 right-8 z-50">
        <button class="bg-[#0F172A] text-white p-3.5 rounded shadow-lg flex items-center justify-center hover:bg-gray-800 transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
            </svg>
        </button>
    </div>

</body>
</html>
